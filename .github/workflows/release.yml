name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxfixes-dev \
            libxi-dev libxcursor-dev libxinerama-dev libasound2-dev

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package
        run: |
          mkdir package
          cp build/fractalviewer README.md LICENSE package/
          tar -C package -czf "fractalviewer-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: "fractalviewer-${{ github.ref_name }}-linux-x86_64.tar.gz"

  build-mingw:
    name: Windows x86_64 (MinGW)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64

      - name: Configure and build
        run: |
          cmake -S . -B build-mingw -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-x86_64.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mingw --parallel

      - name: Package
        run: |
          mkdir package
          cp build-mingw/fractalviewer.exe README.md LICENSE package/
          (cd package && zip -9 "../fractalviewer-${GITHUB_REF_NAME}-windows-x86_64-mingw.zip" *)

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64-mingw
          path: "fractalviewer-${{ github.ref_name }}-windows-x86_64-mingw.zip"

  build-macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --parallel

      - name: Package
        run: |
          mkdir package
          cp build/fractalviewer README.md LICENSE package/
          tar -C package -czf "fractalviewer-${GITHUB_REF_NAME}-macos-arm64.tar.gz" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: "fractalviewer-${{ github.ref_name }}-macos-arm64.tar.gz"

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-mingw, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "fractalviewer ${GITHUB_REF_NAME}" \
            --generate-notes
